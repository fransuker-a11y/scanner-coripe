<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escáner Coripe</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #eeeeee;
}

.contenedor {
  padding: 12px 8px 30px;
}

h1 {
  font-size: 30px;
  margin: 10px 0;
}

.info {
  background: white;
  border-radius: 16px;
  padding: 15px 8px;
  margin-bottom: 12px;
}

.voluntario {
  font-size: 25px;
  font-weight: 900;
}

.accion {
  font-size: 32px;
  font-weight: 900;
  margin-top: 8px;
}

#reader {
  width: 120px;
  height: 120px;
  margin: 12px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover;
}

.mensaje {
  font-size: 20px;
  font-weight: 900;
  margin: 18px 8px;
}

.volver {
  display: inline-block;
  padding: 15px 28px;
  background: #555;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-size: 21px;
  font-weight: 900;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📷 ESCANEAR QR</h1>

<div class="info">
  <div class="voluntario" id="voluntario"></div>
  <div class="accion" id="accion"></div>
</div>

<div id="reader"></div>

<div class="mensaje" id="mensaje">
📷 Apunta al QR de la pulsera
</div>

<a class="volver" id="volver" href="#">
⬅️ VOLVER
</a>

</div>

<script>

const APP_URL =
"https://script.google.com/macros/s/AKfycbxywhlWvDfGCLM1BNhRKMUlSPtxS4E-Odce8zDqrqIHe2ggtEkk7gTJvRHMm6FKRdRz/exec";

const parametros =
new URLSearchParams(window.location.search);

const voluntario =
(parametros.get("voluntario") || "").trim().toUpperCase();

const accion =
(parametros.get("accion") || "").trim().toLowerCase();

document.getElementById("voluntario").textContent =
"👤 " + voluntario;

let nombreAccion = accion;

if (accion === "bebida") nombreAccion = "🥤 BEBIDA";
if (accion === "finished") nombreAccion = "🏁 FINISHED";
if (accion === "almuerzo") nombreAccion = "🍽️ ALMUERZO";

document.getElementById("accion").textContent =
nombreAccion;

document.getElementById("volver").href =
APP_URL + "?voluntario=" +
encodeURIComponent(voluntario);

function extraerId(texto) {

  texto = String(texto).trim();

  let encontrado =
  texto.match(/[?&]id=([0-9]+)/i);

  if (encontrado) return encontrado[1];

  if (/^[0-9]+$/.test(texto)) return texto;

  return null;
}

let procesando = false;
let scanner;

function qrLeido(texto) {

  if (procesando) return;

  const id = extraerId(texto);

  if (!id) {
    document.getElementById("mensaje").textContent =
    "❌ QR NO VÁLIDO";
    return;
  }

  const numero = Number(id);

  if (!numero || numero < 1 || numero > 661) {
    document.getElementById("mensaje").textContent =
    "❌ PULSERA NO VÁLIDA";
    return;
  }

  procesando = true;

  document.getElementById("mensaje").innerHTML =
  "✅ PULSERA " + id + "<br>PROCESANDO...";

  const destino =
  APP_URL +
  "?id=" + encodeURIComponent(id) +
  "&accion=" + encodeURIComponent(accion) +
  "&voluntario=" + encodeURIComponent(voluntario);

  scanner.stop().then(function() {
    window.location.href = destino;
  }).catch(function() {
    window.location.href = destino;
  });
}

async function iniciarScanner() {

  try {

    if (typeof Html5Qrcode === "undefined") {
      throw new Error("No se ha cargado la biblioteca QR");
    }

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    });

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 15,

        qrbox: function(ancho, alto) {

          const lado = Math.min(
            100,
            Math.floor(Math.min(ancho, alto) * 0.80)
          );

          return {
            width: lado,
            height: lado
          };
        },

        aspectRatio: 1.0
      },

      qrLeido,

      function(error) {}

    );

  } catch(error) {

    console.error(error);

    document.getElementById("mensaje").innerHTML =
    "❌ HA OCURRIDO UN ERROR<br><br>" +
    "NO SE PUEDE INICIAR EL ESCÁNER";

  }
}

iniciarScanner();

</script>

</body>
</html>
