<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba botones</title>
</head>

<body style="text-align:center;font-family:Arial;padding:30px;">

<h1>CONTROL CORIPE</h1>

<input id="numero" type="number"
style="font-size:50px;width:250px;height:80px;text-align:center;">

<br><br>

<button onclick="probarManual()"
style="font-size:35px;padding:25px;">
ENVIAR MANUAL
</button>

<br><br>

<button onclick="probarCamara()"
style="font-size:35px;padding:25px;">
📷 ABRIR CÁMARA
</button>

<h2 id="mensaje">Esperando...</h2>

<script>

function probarManual(){

document.getElementById("mensaje").innerHTML =
"✅ EL BOTÓN MANUAL FUNCIONA";

}

function probarCamara(){

document.getElementById("mensaje").innerHTML =
"📷 EL BOTÓN CÁMARA FUNCIONA";

}

</script>

</body>
</html>
