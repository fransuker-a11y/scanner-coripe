<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Coripe</title>

<style>
body {
  margin: 0;
  background: #eeeeee;
  font-family: Arial, sans-serif;
  text-align: center;
}

.contenedor {
  max-width: 500px;
  margin: auto;
  padding: 15px 12px 30px;
}

h1 {
  font-size: 30px;
  margin: 10px 0;
}

.info {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
  font-size: 21px;
  font-weight: bold;
}

input {
  width: 90%;
  max-width: 300px;
  box-sizing: border-box;
  padding: 15px;
  font-size: 28px;
  text-align: center;
  border: 2px solid #ccc;
  border-radius: 10px;
}

button {
  width: 90%;
  max-width: 320px;
  padding: 16px;
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

.manual {
  background: #222;
  color: white;
}

#reader {
  width: 75%;
  max-width: 280px;
  margin: 12px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

#video {
  width: 100%;
  display: block;
  object-fit: cover;
}

#mensaje {
  margin-top: 18px;
  font-size: 18px;
  font-weight: bold;
  min-height: 45px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📷 CONTROL CORIPE</h1>

<div class="info">
👤 <span id="voluntarioTexto"></span>
<br><br>
🎟️ <span id="accionTexto"></span>
</div>

<input
  id="numero"
  type="number"
  inputmode="numeric"
  min="1"
  max="661"
  placeholder="Nº pulsera"
>

<br>

<button class="manual" id="botonManual">
REGISTRAR PULSERA
</button>

<div id="reader">
  <video id="video" autoplay muted playsinline></video>
</div>

<div id="mensaje">
📷 Iniciando cámara...
</div>

</div>

<script type="module">

import {
  BrowserMultiFormatReader
} from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";


const parametros =
new URLSearchParams(window.location.search);

const voluntario =
(parametros.get("voluntario") || "").trim().toUpperCase();

const accion =
(parametros.get("accion") || "").trim().toLowerCase();

const APP_URL =
"https://script.google.com/macros/s/AKfycbxywhlWvDfGCLM1BNhRKMUlSPtxS4E-Odce8zDqrqIHe2ggtEkk7gTJvRHMm6FKRdRz/exec";

document.getElementById("voluntarioTexto").textContent =
voluntario || "SIN VOLUNTARIO";

document.getElementById("accionTexto").textContent =
accion || "SIN ACCIÓN";


function mostrarMensaje(texto) {
  document.getElementById("mensaje").textContent = texto;
}


// REGISTRAR PULSERA

function registrarPulsera(id) {

  const numero = Number(id);

  if (!Number.isInteger(numero) || numero < 1 || numero > 661) {
    mostrarMensaje("❌ PULSERA NO VÁLIDA");
    return;
  }

  mostrarMensaje("✅ PULSERA " + numero + " PROCESANDO...");

  const url =
    APP_URL +
    "?id=" + encodeURIComponent(numero) +
    "&accion=" + encodeURIComponent(accion) +
    "&voluntario=" + encodeURIComponent(voluntario);

  window.location.href = url;
}


// REGISTRO MANUAL

document.getElementById("botonManual")
.addEventListener("click", function() {

  const numero =
    document.getElementById("numero").value.trim();

  if (!numero) {
    mostrarMensaje("⚠️ Introduce el número de pulsera");
    return;
  }

  registrarPulsera(numero);

});


// EXTRAER IDENTIFICADOR DEL QR

function extraerId(texto) {

  texto = String(texto).trim();

  try {
    const url = new URL(texto);
    const id = url.searchParams.get("id");

    if (id) return id;
  } catch(error) {}

  const encontrado =
    texto.match(/[?&]id=([0-9]+)/i);

  if (encontrado) return encontrado[1];

  if (/^[0-9]+$/.test(texto)) return texto;

  return null;
}


// ESCÁNER ZXING

let lector = null;
let controles = null;
let procesando = false;


async function qrLeido(texto) {

  if (procesando) return;

  mostrarMensaje("📖 QR DETECTADO: " + texto);

  const id = extraerId(texto);

  if (!id) {
    mostrarMensaje("⚠️ QR LEÍDO, PERO NO RECONOCE EL NÚMERO: " + texto);
    return;
  }

  const numero = Number(id);

  if (!Number.isInteger(numero) || numero < 1 || numero > 661) {
    mostrarMensaje("❌ PULSERA NO VÁLIDA: " + numero);
    return;
  }

  procesando = true;

  mostrarMensaje("✅ PULSERA " + numero + " PROCESANDO...");

  if (controles) {
    controles.stop();
  }

  registrarPulsera(numero);
}


// INICIAR CÁMARA

async function iniciarScanner() {

  try {

    lector = new BrowserMultiFormatReader();

    mostrarMensaje("📷 Buscando cámara trasera...");

    const dispositivos =
      await lector.listVideoInputDevices();

    if (!dispositivos.length) {
      throw new Error("No se encuentra ninguna cámara");
    }

    const trasera = dispositivos.find(camara =>
      /back|rear|environment|trasera|posterior/i.test(camara.label)
    );

    const camaraElegida =
      trasera || dispositivos[dispositivos.length - 1];

    controles = await lector.decodeFromVideoDevice(
      camaraElegida.deviceId,
      document.getElementById("video"),
      (resultado, error) => {

        if (resultado && !procesando) {
          qrLeido(resultado.getText());
        }

      }
    );

    mostrarMensaje("📷 APUNTA AL QR DE LA PULSERA");

  } catch(error) {

    mostrarMensaje("❌ ERROR DEL ESCÁNER: " + error.message);

  }

}


// ARRANQUE

iniciarScanner();

</script>

</body>
</html>
