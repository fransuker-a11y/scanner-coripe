<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Coripe</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
margin:0;
padding:20px 10px 40px;
font-family:Arial,sans-serif;
text-align:center;
background:#eeeeee;
}

.voluntario{
font-size:55px;
font-weight:900;
margin:10px 0 25px;
}

.info{
background:white;
border-radius:25px;
padding:25px 10px;
}

.titulo{
font-size:35px;
font-weight:900;
}

.accion{
font-size:65px;
font-weight:900;
margin-top:15px;
}

.pulsera{
font-size:38px;
font-weight:900;
margin:30px 0 15px;
}

.numero{
font-size:75px;
font-weight:900;
width:300px;
height:120px;
text-align:center;
border:6px solid #222;
border-radius:25px;
}

.enviar{
font-size:55px;
font-weight:900;
width:95%;
max-width:600px;
height:125px;
margin-top:25px;
background:#4CAF50;
color:white;
border:none;
border-radius:30px;
}

.escanear{
margin-top:40px;
font-size:40px;
font-weight:900;
}

#reader{
width:100%;
max-width:600px;
margin:20px auto;
background:white;
border-radius:20px;
overflow:hidden;
}

.boton-camara{
font-size:40px;
font-weight:900;
padding:25px 35px;
background:#2196F3;
color:white;
border:none;
border-radius:30px;
}

.mensaje{
font-size:28px;
font-weight:900;
margin:20px;
}

#registroOculto{
display:none;
}
</style>
</head>

<body>

<iframe
name="registroOculto"
id="registroOculto">
</iframe>

<div class="voluntario" id="voluntario"></div>

<div class="info">

<div class="titulo">
CONTROL AUTORIZADO
</div>

<div class="accion" id="accion"></div>

</div>

<div class="pulsera">
NUMERO DE PULSERA
</div>

<form id="formulario">

<input
class="numero"
id="numero"
type="number"
min="1"
max="661"
required
inputmode="numeric">

<br>

<button class="enviar" type="submit">
ENVIAR
</button>

</form>

<div class="escanear">
📷 ESCANEAR QR
</div>

<div id="reader"></div>

<div class="mensaje" id="mensaje">
Pulsa ABRIR CÁMARA
</div>

<button
class="boton-camara"
type="button"
onclick="abrirCamara()">

📷 ABRIR CÁMARA

</button>

<script>

const APP_URL =
"https://script.google.com/macros/s/AKfycbxywhlWvDfGCLM1BNhRKMUlSPtxS4E-Odce8zDqrqIHe2ggtEkk7gTJvRHMm6FKRdRz/exec";

const parametros =
new URLSearchParams(window.location.search);

const voluntario =
(parametros.get("voluntario") || "")
.trim()
.toUpperCase();

const accion =
(parametros.get("accion") || "")
.trim()
.toLowerCase();

document.getElementById("voluntario").textContent =
"👤 VOLUNTARIO " + voluntario;

let tituloAccion = accion;

if(accion === "bebida"){
tituloAccion = "🥤 BEBIDA";
}

if(accion === "finished"){
tituloAccion = "🏁 FINISHED";
}

if(accion === "almuerzo"){
tituloAccion = "🍽️ ALMUERZO";
}

document.getElementById("accion").textContent =
tituloAccion;


/* FUNCION DE ENVIO */

function registrarPulsera(id){

const formularioOculto =
document.createElement("form");

formularioOculto.method = "GET";
formularioOculto.action = APP_URL;
formularioOculto.target = "registroOculto";
formularioOculto.style.display = "none";

const campoId =
document.createElement("input");

campoId.name = "id";
campoId.value = id;

const campoAccion =
document.createElement("input");

campoAccion.name = "accion";
campoAccion.value = accion;

const campoVoluntario =
document.createElement("input");

campoVoluntario.name = "voluntario";
campoVoluntario.value = voluntario;

formularioOculto.appendChild(campoId);
formularioOculto.appendChild(campoAccion);
formularioOculto.appendChild(campoVoluntario);

document.body.appendChild(formularioOculto);

formularioOculto.submit();

setTimeout(function(){

formularioOculto.remove();

},3000);

}


/* MANUAL */

document.getElementById("formulario").addEventListener(
"submit",
function(e){

e.preventDefault();

const id =
document.getElementById("numero").value;

if(!id){
return;
}

if(Number(id) < 1 || Number(id) > 661){

document.getElementById("mensaje").innerHTML =
"❌ PULSERA NO VÁLIDA";

return;
}

registrarPulsera(id);

document.getElementById("mensaje").innerHTML =
