<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Coripe</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f1f1f1;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 10px 0 20px;
  font-size: 27px;
}

.contenedor {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.cam {
  width: 100%;
  min-height: 75px;
  border: 0;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

#video {
  display: none;
  width: 100%;
  max-height: 350px;
  margin-top: 15px;
  background: #000;
  border-radius: 12px;
  object-fit: cover;
}

.parar {
  display: none;
  width: 100%;
  margin-top: 10px;
  padding: 15px;
  background: #b3261e;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 17px;
  margin-top: 20px;
  border: 2px solid #ccc;
  border-radius: 10px;
  font-size: 22px;
  text-align: center;
}

.registrar {
  width: 100%;
  padding: 17px;
  margin-top: 10px;
  background: #16803c;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
}

#mensaje {
  margin-top: 18px;
  font-size: 18px;
  font-weight: bold;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="contenedor">
  <h1>CONTROL CORIPE</h1>

  <button class="cam" onclick="abrirCamara()">
    📷 ESCANEAR QR
  </button>

  <video id="video" playsinline muted></video>

  <button class="parar" id="botonParar" onclick="detenerCamara()">
    CERRAR CÁMARA
  </button>

  <input
    type="text"
    id="numero"
    placeholder="Número de pulsera"
    inputmode="numeric"
    autocomplete="off"
  >

  <button class="registrar" onclick="registrarPulsera()">
    REGISTRAR
  </button>

  <div id="mensaje"></div>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbxywhlWvDfGCLM1BNhRKMUlSPtxS4E-Odce8zDqrqIHe2ggtEkk7gTJvRHMm6FKRdRz/exec";

const parametros = new URLSearchParams(window.location.search);
const voluntario = parametros.get("voluntario") || "";
const accion = parametros.get("accion") || "";

let lector = null;
let controlesCamara = null;
let procesando = false;

function mensaje(texto, color = "#222") {
  const elemento = document.getElementById("mensaje");
  elemento.textContent = texto;
  elemento.style.color = color;
}

async function abrirCamara() {
  mensaje("Preparando cámara...");

  if (!window.isSecureContext) {
    mensaje("Abre la página mediante HTTPS.", "red");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mensaje("Este navegador no permite acceder a la cámara.", "red");
    return;
  }

  if (!window.ZXingBrowser) {
    mensaje("No se ha podido cargar el lector QR. Comprueba tu conexión.", "red");
    return;
  }

  try {
    detenerCamara();

    lector = new ZXingBrowser.BrowserMultiFormatReader();

    const video = document.getElementById("video");
    video.style.display = "block";
    document.getElementById("botonParar").style.display = "block";

    mensaje("Solicitando permiso para usar la cámara...");

    controlesCamara = await lector.decodeFromVideoDevice(
      undefined,
      video,
      (resultado, error) => {
        if (resultado && !procesando) {
          procesando = true;

          const textoQR = resultado.getText();
          let numero = textoQR;

          try {
            const url = new URL(textoQR);
            numero = url.searchParams.get("id") || textoQR;
          } catch (e) {
            // Si el QR no contiene una URL, se usa su texto directamente.
          }

          document.getElementById("numero").value = numero;

          detenerCamara();
          registrarPulsera(numero);
        }
      }
    );

    mensaje("Cámara activa. Enfoca el código QR.", "green");

  } catch (error) {
    detenerCamara();
    mensaje("No se pudo abrir la cámara: " + error.message, "red");
  }
}

function detenerCamara() {
  if (controlesCamara) {
    controlesCamara.stop();
    controlesCamara = null;
  }

  if (lector) {
    lector = null;
  }

  const video = document.getElementById("video");

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(pista => pista.stop());
    video.srcObject = null;
  }

  video.style.display = "none";
  document.getElementById("botonParar").style.display = "none";
  procesando = false;
}

async function registrarPulsera(numeroForzado) {
  const numero = String(
    numeroForzado || document.getElementById("numero").value
  ).trim();

  if (!numero) {
    mensaje("Introduce o escanea un número de pulsera.", "red");
    return;
  }

  mensaje("Registrando pulsera...");

  const url = APP_URL +
    "?id=" + encodeURIComponent(numero) +
    "&voluntario=" + encodeURIComponent(voluntario) +
    "&accion=" + encodeURIComponent(accion);

  try {
    const respuesta = await fetch(url);
    const resultado = await respuesta.text();

    mensaje(resultado, "green");
    document.getElementById("numero").value = "";

  } catch (error) {
    mensaje("Error al registrar. Comprueba la conexión.", "red");
  }
}
</script>

</body>
</html>
