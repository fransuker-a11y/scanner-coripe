<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Coripe</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body {
  margin: 0;
  background: #eeeeee;
  font-family: Arial, sans-serif;
  text-align: center;
}

.contenedor {
  max-width: 500px;
  margin: auto;
  padding: 15px 12px 30px;
}

h1 {
  font-size: 30px;
  margin: 10px 0;
}

.info {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
  font-size: 21px;
  font-weight: bold;
}

input {
  width: 90%;
  max-width: 300px;
  box-sizing: border-box;
  padding: 15px;
  font-size: 28px;
  text-align: center;
  border: 2px solid #ccc;
  border-radius: 10px;
}

button {
  width: 90%;
  max-width: 320px;
  padding: 16px;
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

.manual {
  background: #222;
  color: white;
}

#reader {
  width: 100%;
  max-width: 400px;
  margin: 15px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

#reader video {
  object-fit: cover;
}

#mensaje {
  margin-top: 18px;
  font-size: 21px;
  font-weight: bold;
  min-height: 45px;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📷 CONTROL CORIPE</h1>

<div class="info">
👤 <span id="voluntarioTexto"></span>
<br><br>
🎟️ <span id="accionTexto"></span>
</div>

<input
  id="numero"
  type="number"
  inputmode="numeric"
  min="1"
  max="661"
  placeholder="Nº pulsera"
>

<br>

<button class="manual" onclick="registrarManual()">
REGISTRAR PULSERA
</button>

<div id="reader"></div>

<div id="mensaje">
📷 Iniciando cámara...
</div>

</div>

<script>

const parametros =
new URLSearchParams(window.location.search);

const voluntario =
(parametros.get("voluntario") || "").trim().toUpperCase();

const accion =
(parametros.get("accion") || "").trim().toLowerCase();

const APP_URL =
"https://script.google.com/macros/s/AKfycbxywhlWvDfGCLM1BNhRKMUlSPtxS4E-Odce8zDqrqIHe2ggtEkk7gTJvRHMm6FKRdRz/exec";

document.getElementById("voluntarioTexto").textContent =
voluntario || "SIN VOLUNTARIO";

document.getElementById("accionTexto").textContent =
accion || "SIN ACCIÓN";


function mostrarMensaje(texto) {
  document.getElementById("mensaje").textContent = texto;
}


// REGISTRAR PULSERA

function registrarPulsera(id) {

  const numero = Number(id);

  if (!Number.isInteger(numero) || numero < 1 || numero > 661) {
    mostrarMensaje("❌ PULSERA NO VÁLIDA");
    return;
  }

  mostrarMensaje("✅ PULSERA " + numero + " PROCESANDO...");

  const url =
    APP_URL +
    "?id=" + encodeURIComponent(numero) +
    "&accion=" + encodeURIComponent(accion) +
    "&voluntario=" + encodeURIComponent(voluntario);

  window.location.href = url;
}


// REGISTRO MANUAL

function registrarManual() {

  const numero =
    document.getElementById("numero").value.trim();

  if (!numero) {
    mostrarMensaje("⚠️ Introduce el número de pulsera");
    return;
  }

  registrarPulsera(numero);
}


// ESCÁNER QR

let scanner = null;
let procesando = false;


function extraerId(texto) {

  texto = String(texto).trim();

  const encontrado =
    texto.match(/[?&]id=([0-9]+)/i);

  if (encontrado) return encontrado[1];

  if (/^[0-9]+$/.test(texto)) return texto;

  return null;
}


// QR DETECTADO

async function qrLeido(texto) {

  if (procesando) return;

  const id = extraerId(texto);

  if (!id) {
    mostrarMensaje("❌ QR NO VÁLIDO");
    return;
  }

  const numero = Number(id);

  if (!Number.isInteger(numero) || numero < 1 || numero > 661) {
    mostrarMensaje("❌ PULSERA NO VÁLIDA");
    return;
  }

  procesando = true;

  mostrarMensaje("✅ PULSERA " + numero + " PROCESANDO...");

  try {
    await scanner.stop();
  } catch (error) {
    // Continuar con el registro
  }

  registrarPulsera(numero);
}


// INICIAR CÁMARA AUTOMÁTICAMENTE

async function iniciarScanner() {

  if (!window.Html5Qrcode) {
    mostrarMensaje("❌ ERROR AL CARGAR EL ESCÁNER");
    return;
  }

  scanner = new Html5Qrcode("reader");

  try {

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 15,

        qrbox: function(ancho, alto) {

          const lado = Math.min(
            220,
            Math.floor(Math.min(ancho, alto) * 0.70)
          );

          return {
            width: lado,
            height: lado
          };
        },

        aspectRatio: 1.0,

        videoConstraints: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      },

      qrLeido,

      function(error) {}

    );

    mostrarMensaje("📷 APUNTA AL QR DE LA PULSERA");

  } catch(error) {

    mostrarMensaje(
      "❌ NO SE PUEDE ABRIR LA CÁMARA. COMPRUEBA LOS PERMISOS."
    );

  }
}


// ARRANQUE

iniciarScanner();

</script>

</body>
</html>
