<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Coripe</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f4f4;
  font-family:Arial,sans-serif;
  text-align:center;
}

.contenedor{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:25px 20px;
}

h1{
  margin-bottom:5px;
}

.info{
  color:#555;
  margin-bottom:25px;
}

input{
  width:90%;
  max-width:300px;
  padding:15px;
  font-size:28px;
  text-align:center;
  border:2px solid #ccc;
  border-radius:10px;
}

button{
  width:90%;
  max-width:320px;
  padding:16px;
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

.manual{
  background:#222;
  color:white;
}

.cam{
  background:#1976d2;
  color:white;
}

#reader{
  width:100%;
  max-width:420px;
  aspect-ratio:4 / 3;
  margin:20px auto;
  overflow:hidden;
  border-radius:12px;
  background:#000;
}

#reader video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

#mensaje{
  margin-top:25px;
  font-size:22px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.oculto{
  display:none;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>CONTROL CORIPE</h1>

<div class="info">
👤 <span id="voluntarioTexto"></span>
<br>
🎟️ <span id="accionTexto"></span>
</div>

<input
  id="numero"
  type="number"
  inputmode="numeric"
  placeholder="Nº pulsera"
>

<br>

<button class="manual" onclick="registrarManual()">
REGISTRAR PULSERA
</button>

<button class="cam" onclick="abrirCamara()">
📷 ESCANEAR QR
</button>

<div id="reader"></div>

<div id="mensaje"></div>

</div>

<iframe name="registroOculto" class="oculto"></iframe>

<script>

const parametros = new URLSearchParams(window.location.search);

const voluntario =
(parametros.get("voluntario") || "").trim().toUpperCase();

const accion =
(parametros.get("accion") || "").trim().toLowerCase();

const APP_URL =
"https://script.google.com/macros/s/AKfycbxywhlWvDfGCLM1BNhRKMUlSPtxS4E-Odce8zDqrqIHe2ggtEkk7gTJvRHMm6FKRdRz/exec";

document.getElementById("voluntarioTexto").textContent =
voluntario || "SIN VOLUNTARIO";

document.getElementById("accionTexto").textContent =
accion || "SIN ACCIÓN";


function mostrarMensaje(texto){
  document.getElementById("mensaje").textContent = texto;
}


function registrarPulsera(id, despues){

  const url =
    APP_URL +
    "?id=" + encodeURIComponent(id) +
    "&accion=" + encodeURIComponent(accion) +
    "&voluntario=" + encodeURIComponent(voluntario);

  window.location.href = url;
}


function registrarManual(){

  const numero =
    document.getElementById("numero").value.trim();

  if(!numero){
    mostrarMensaje("⚠️ Introduce el número de pulsera");
    return;
  }

  registrarPulsera(numero);

  document.getElementById("numero").value = "";
}


let scanner = null;
let controlesCamara = null;
let procesando = false;


function detenerCamara(){

  if(controlesCamara){
    controlesCamara.stop();
    controlesCamara = null;
  }

  const video = document.querySelector("#reader video");

  if(video && video.srcObject){
    video.srcObject.getTracks().forEach(pista => pista.stop());
    video.srcObject = null;
  }

  scanner = null;
}

function abrirCamara(){

  alert("BOTÓN CONECTADO");

  if(scanner) return;

  if(!window.ZXingBrowser){
    mostrarMensaje("❌ No se pudo cargar el lector QR");
    return;
  }

  mostrarMensaje("📷 Abriendo cámara...");

  procesando = false;

  scanner = new ZXingBrowser.BrowserMultiFormatReader();

  const reader = document.getElementById("reader");
  reader.innerHTML = "";

  const video = document.createElement("video");

  video.setAttribute("playsinline", "true");
  video.setAttribute("autoplay", "true");
  video.muted = true;

  video.style.width = "100%";
  video.style.height = "100%";
  video.style.objectFit = "contain";

  reader.appendChild(video);

  scanner.decodeFromVideoDevice(
    undefined,
    video,
    (resultado, error, controles) => {

      if(controles){
        controlesCamara = controles;
      }

      if(!resultado || procesando) return;

      procesando = true;

      try{

        const url = new URL(resultado.getText());
        const numero = url.searchParams.get("id");

        if(!numero){
          procesando = false;
          mostrarMensaje("❌ QR no válido");
          return;
        }

        mostrarMensaje("✅ QR LEÍDO: " + numero);

        detenerCamara();
        registrarPulsera(numero);

      }catch(error){

        procesando = false;
        mostrarMensaje("❌ QR no válido");

      }

    }
  ).catch(error => {

    detenerCamara();
    mostrarMensaje("❌ Error cámara: " + error.message);

  });

}

</script>

</body>
</html>
